<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Unlocker - Multi Step</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .btn {
            display: block;
            background-color: #2563eb;
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn:hover { background-color: #1d4ed8; }
        .btn:disabled, .disabled {
            background-color: #475569;
            pointer-events: none;
            opacity: 0.6;
        }
        #step-indicator {
            color: #38bdf8;
            font-weight: bold;
            margin-bottom: 10px;
        }
        #timer-text {
            margin-top: 15px;
            color: #94a3b8;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🔒 Video Unlocker</h2>
        <div id="step-indicator">STEP 1 OF 3</div>
        <p id="instruction-text">වීඩියෝව ලබා ගැනීමට පළමු දැන්වීම නරඹා තත්පර 10ක් රැඳී සිටින්න.</p>
        
        <!-- ඔබේ Monetag Ad Link එක -->
        <a href="https://uplcm.com/4/10303491" target="_blank" id="ad-btn" class="btn" onclick="startTimer()">📢 Visit Advertisement 1</a>
        
        <div id="timer-text">දැන්වීම බැලීමෙන් පසු ටයිමර් එක ක්‍රියාත්මක වේ...</div>
        
        <!-- අවසානයේ වීඩියෝව ලබා දෙන බටන් එක -->
        <a href="#" id="get-video-btn" class="btn disabled">🎉 Get Video Now</a>
    </div>

    <script>
        let currentStep = 1;
        let timerStarted = false;
        const monetagLink = "https://uplcm.com/4/10303491";

        function startTimer() {
            if (timerStarted) return;
            timerStarted = true;
            
            let timeLeft = 10;
            const timerText = document.getElementById("timer-text");
            const adBtn = document.getElementById("ad-btn");
            const stepIndicator = document.getElementById("step-indicator");
            const instructionText = document.getElementById("instruction-text");
            const getVideoBtn = document.getElementById("get-video-btn");
            
            let countdown = setInterval(function() {
                if (timeLeft > 0) {
                    timerText.innerHTML = `⏳ පියවර ${currentStep}: ඉතිරි කාලය තත්පර ${timeLeft} කි...`;
                    timeLeft--;
                } else {
                    clearInterval(countdown);
                    timerStarted = false;
                    
                    if (currentStep < 3) {
                        // ඊළඟ පියවරට (Step 2 හෝ Step 3) යොමු කිරීම
                        currentStep++;
                        stepIndicator.innerHTML = `STEP ${currentStep} OF 3`;
                        instructionText.innerHTML = `සාර්ථකයි! දැන් ${currentStep} වන දැන්වීම නරඹන්න.`;
                        adBtn.innerHTML = `📢 Visit Advertisement ${currentStep}`;
                        timerText.innerHTML = "දැන්වීම බැලීමට ඉහත බටන් එක ඔබන්න.";
                    } else {
                        // පියවර 3ම අවසන් වූ පසු
                        stepIndicator.innerHTML = "✅ ALL STEPS COMPLETED!";
                        instructionText.innerHTML = "සියලුම දැන්වීම් බැලීම සාර්ථකයි!";
                        adBtn.style.display = "none"; // Ad button එක ඉවත් කිරීම
                        timerText.innerHTML = "දැන් ඔබට වීඩියෝව ලබාගත හැක.";
                        getVideoBtn.classList.remove("disabled");
                        
                        // URL එකේ ඇති video ID එක ලබා ගැනීම
                        const urlParams = new URLSearchParams(window.location.search);
                        const msgId = urlParams.get('id');
                        
                        // බොට්ගේ Username එක මෙතැනට දාන්න (උදා: t.me/YourBotUsername)
                        getVideoBtn.href = `https://t.me/YourBotUsername?start=get_${msgId}`;
                    }
                }
            }, 1000);
        }
    </script>
</body>
</html>
